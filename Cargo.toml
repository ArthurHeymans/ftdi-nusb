[package]
name = "ftdi-nusb"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure Rust library for communicating with FTDI USB devices, backed by nusb"
repository = "https://github.com/ArthurHeymans/ftdi-nusb"
keywords = ["ftdi", "usb", "serial", "mpsse", "bitbang"]
categories = ["hardware-support", "embedded"]

[features]
default = []
embedded-hal = ["dep:embedded-hal", "dep:embedded-io"]

[package.metadata.docs.rs]
# WebUSB bindings require the unstable web_sys APIs cfg.
all-features = true
rustc-args = ["--cfg=web_sys_unstable_apis"]

[dependencies]
nusb = "0.2.6"
thiserror = "2"
log = "0.4"

embedded-hal = { version = "1.0.0", optional = true }
embedded-io = { version = "0.7.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maybe-async = { version = "0.2", features = ["is_sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
maybe-async = "0.2"

# WebUSB types require building with RUSTFLAGS='--cfg=web_sys_unstable_apis'.
web-sys = { version = "0.3", features = [
  "Navigator",
  "Window",
  "WorkerGlobalScope",
  "console",
  "Usb",
  "UsbDevice",
  "UsbDeviceFilter",
  "UsbDeviceRequestOptions",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
env_logger = "0.11"
proptest = "1"
